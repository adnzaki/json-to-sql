<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" />

  <!-- Database & Diagram Nodes -->
  <g transform="translate(64, 76)">
    <!-- Main Cylinder 1 (Top) -->
    <ellipse cx="192" cy="70" rx="140" ry="42" fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.3" />
    <path d="M 52 70 A 140 42 0 0 0 332 70 V 130 A 140 42 0 0 1 52 130 Z" fill="url(#primaryGrad)" opacity="0.85" />
    <ellipse cx="192" cy="70" rx="140" ry="42" fill="#38bdf8" />
    <ellipse cx="192" cy="70" rx="120" ry="34" fill="#0284c7" />

    <!-- Main Cylinder 2 (Middle) -->
    <path d="M 52 150 A 140 42 0 0 0 332 150 V 210 A 140 42 0 0 1 52 210 Z" fill="url(#primaryGrad)" opacity="0.7" />
    <ellipse cx="192" cy="150" rx="140" ry="42" fill="#4f46e5" />
    <ellipse cx="192" cy="150" rx="120" ry="34" fill="#3730a3" />

    <!-- Main Cylinder 3 (Bottom) -->
    <path d="M 52 230 A 140 42 0 0 0 332 230 V 290 A 140 42 0 0 1 52 290 Z" fill="url(#primaryGrad)" opacity="0.9" />
    <ellipse cx="192" cy="230" rx="140" ry="42" fill="#7c3aed" />
    <ellipse cx="192" cy="230" rx="120" ry="34" fill="#5b21b6" />

    <!-- Code / JSON curly braces & SQL branch badge -->
    <rect x="130" y="270" width="124" height="60" rx="16" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3" />
    <text x="192" y="310" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#34d399" text-anchor="middle">{ } ➔ SQL</text>
  </g>
</svg>
